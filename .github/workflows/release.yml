name: Build, Release, and Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  build_release_publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Extract release notes from CHANGELOG.md
        # Fails the release before anything is built or published if the tag has no changelog entry.
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")" \
            || { echo "::error::Tag $GITHUB_REF_NAME does not match package.json version"; exit 1; }
          node scripts/changelog.mjs notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run tests
        run: npm run ci:test
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
      - name: Publish to NPM
        run: npm publish --provenance --access public
