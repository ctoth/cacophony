<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Cacophony scheduled buffer rendering</title>
  </head>
  <body>
    <script type="module">
      import { Cacophony } from "/src/cacophony.ts";

      window.runScheduledBufferRenderCheck = async () => {
        if (typeof OfflineAudioContext === "undefined") {
          return { supported: false };
        }

        const sampleRate = 48_000;
        const startFrame = 240;
        const clipFrames = 128;
        const length = 1_024;
        const context = new OfflineAudioContext(1, length, sampleRate);
        const cacophony = Cacophony.createOffline(
          { context, length, numberOfChannels: 1, sampleRate },
          undefined,
          { autoUnlock: false, quiet: true },
        );
        const buffer = context.createBuffer(1, clipFrames, sampleRate);
        buffer.getChannelData(0).fill(0.5);
        const sound = await cacophony.createSound(buffer, "buffer", "stereo");

        sound.play({ at: startFrame / sampleRate });
        sound.play({ at: (startFrame + clipFrames) / sampleRate });

        const rendered = await context.startRendering();
        const samples = rendered.getChannelData(0);
        const firstAudibleFrame = samples.findIndex((sample) => Math.abs(sample) > 1e-5);
        const gapless = samples
          .slice(startFrame + 1, startFrame + clipFrames * 2 - 1)
          .every((sample) => Math.abs(sample) > 1e-5);
        return { firstAudibleFrame, gapless, startFrame, supported: true };
      };
    </script>
  </body>
</html>
